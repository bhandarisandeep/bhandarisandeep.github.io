    <text x="60" y="95" fill="url(#cg)" font-size="46" font-weight="700" text-anchor="middle">🛡</text>
  </g>
  <!-- STRIDE letters -->
  <g fill="#e2e8f0" font-size="15" font-weight="700">
    <text x="250" y="70">S <tspan fill="#8892a8" font-weight="400" font-size="12">poofing</tspan></text>
    <text x="250" y="102">T <tspan fill="#8892a8" font-weight="400" font-size="12">ampering</tspan></text>
    <text x="250" y="134">R <tspan fill="#8892a8" font-weight="400" font-size="12">epudiation</tspan></text>
    <text x="250" y="166">I <tspan fill="#8892a8" font-weight="400" font-size="12">nfo Disclosure</tspan></text>
    <text x="250" y="198">D <tspan fill="#8892a8" font-weight="400" font-size="12">enial of Service</tspan></text>
    <text x="250" y="230">E <tspan fill="#8892a8" font-weight="400" font-size="12">levation of Priv.</tspan></text>
  </g>
  <text x="32" y="270" fill="url(#cg)" font-size="16" font-weight="700">// Threat Modeling &amp; STRIDE</text>
