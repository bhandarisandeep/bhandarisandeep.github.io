<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'JetBrains Mono', monospace" role="img" aria-label="Threat modeling — STRIDE">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="300" fill="#0f1623"/>
  <rect width="640" height="300" fill="url(#glow)"/>
  <!-- shield -->
  <g transform="translate(70 80)">
    <path d="M60 0 L118 22 V70 C118 118 92 148 60 162 C28 148 2 118 2 70 V22 Z"
