<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'JetBrains Mono', monospace" role="img" aria-label="HDR Glow">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.72" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffef0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="300" fill="#0f1623"/>
  <rect width="640" height="300" fill="url(#hglow)"/>

  <!-- photo frame -->
  <rect x="64" y="56" width="220" height="175" rx="10" fill="rgba(0,240,255,0.05)" stroke="url(#hg)" stroke-width="2"/>
  <!-- sky gradient inside frame -->
  <rect x="68" y="60" width="212" height="90" fill="#13304a"/>
  <!-- ground -->
  <rect x="68" y="150" width="212" height="77" fill="#16241c"/>
  <!-- glowing sun -->
  <circle cx="205" cy="95" r="46" fill="url(#sunglow)"/>
  <circle cx="205" cy="95" r="13" fill="#fffef0"/>
  <!-- small light points on the ground, echoing the tool's "lights" ramp -->
  <circle cx="110" cy="175" r="3" fill="#fffef0"/>
  <circle cx="110" cy="175" r="8" fill="#fffef0" opacity="0.25"/>
  <circle cx="150" cy="185" r="2.4" fill="#fffef0"/>
  <circle cx="150" cy="185" r="7" fill="#fffef0" opacity="0.2"/>

  <!-- gain-map readout -->
  <g transform="translate(348 70)">
    <text x="0" y="0" fill="#8892a8" font-size="11">gain map</text>
    <rect x="0" y="12" width="90" height="68" rx="6" fill="#06090f" stroke="rgba(0,240,255,0.25)"/>
    <rect x="0" y="12" width="90" height="30" fill="#2a2f3a"/>
    <circle cx="48" cy="27" r="11" fill="#fff"/>
    <circle cx="26" cy="54" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="68" cy="58" r="1.6" fill="#fff" opacity="0.7"/>
  </g>

  <text x="348" y="200" fill="url(#hg)" font-size="15" font-weight="700">2.6&#215; sky</text>
  <text x="348" y="222" fill="url(#hg)" font-size="15" font-weight="700">6.0&#215; lights</text>

  <text x="32" y="270" fill="url(#hg)" font-size="16" font-weight="700">// HDR Glow</text>
</svg>
