<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'JetBrains Mono', monospace" role="img" aria-label="Hello world — starting the blog">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="300" fill="#0f1623"/>
  <rect width="640" height="300" fill="url(#hglow)"/>
  <!-- terminal window -->
  <g transform="translate(90 70)">
    <rect x="0" y="0" width="460" height="160" rx="12" fill="#0a0e17" stroke="url(#hg)" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="24" r="6" fill="#27c93f"/>
    <text x="24" y="78" fill="#00ff88" font-size="18"><tspan fill="#00f0ff">$</tspan> whoami</text>
    <text x="24" y="108" fill="#e2e8f0" font-size="16">security_engineer</text>
    <text x="24" y="138" fill="#00ff88" font-size="18"><tspan fill="#00f0ff">$</tspan> echo "hello, world"<tspan fill="#00f0ff" font-size="18">_</tspan></text>
  </g>
  <text x="32" y="270" fill="url(#hg)" font-size="16" font-weight="700">// Starting this blog</text>
</svg>
