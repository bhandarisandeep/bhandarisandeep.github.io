<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'JetBrains Mono', monospace" role="img" aria-label="Mac, Windows laptop and phone connect over Wi-Fi 6 to one PC that holds the shared folder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="#0a0e17"/>
  <text x="30" y="36" fill="url(#g)" font-size="18" font-weight="700">// One PC, Shared Across Every Device</text>

  <!-- client devices -->
  <g fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4">
    <rect x="30" y="70"  width="190" height="60" rx="8"/>
    <rect x="30" y="150" width="190" height="60" rx="8"/>
    <rect x="30" y="230" width="190" height="60" rx="8"/>
  </g>
  <g fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">
    <text x="125" y="96">Mac</text>
    <text x="125" y="176">Windows laptop</text>
    <text x="125" y="256">Phone / tablet</text>
  </g>

  <!-- router -->
  <rect x="330" y="120" width="180" height="90" rx="10" fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="420" y="152" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Wi-Fi 6 router</text>
  <text x="420" y="176" fill="#8892a8" font-size="11" text-anchor="middle">home network</text>

  <!-- storage PC -->
  <rect x="630" y="60" width="240" height="230" rx="12" fill="#0f1623" stroke="#00ff88" stroke-opacity="0.45"/>
  <text x="750" y="96" fill="#00ff88" font-size="14" font-weight="700" text-anchor="middle">Windows PC</text>
  <text x="750" y="118" fill="#8892a8" font-size="11" text-anchor="middle">its own internal drive</text>
  <rect x="655" y="140" width="190" height="70" rx="8" fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4"/>
  <text x="750" y="168" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">C:\Share</text>
  <text x="750" y="190" fill="#8892a8" font-size="11" text-anchor="middle">SMB shared folder</text>
  <text x="750" y="250" fill="#8892a8" font-size="11" text-anchor="middle">no NAS, no extra box</text>

  <!-- links -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" stroke-opacity="0.7">
    <line x1="220" y1="100" x2="330" y2="150"/>
    <line x1="220" y1="180" x2="330" y2="165"/>
    <line x1="220" y1="260" x2="330" y2="180"/>
    <line x1="510" y1="165" x2="630" y2="165"/>
  </g>
  <text x="570" y="155" fill="#8892a8" font-size="10" text-anchor="middle">SMB</text>

  <text x="30" y="308" fill="#8892a8" font-size="11">Every device reads and writes the same folder. Nothing extra to buy.</text>
</svg>
