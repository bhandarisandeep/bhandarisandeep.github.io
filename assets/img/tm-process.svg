<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="'JetBrains Mono', monospace" role="img" aria-label="Six-step threat modeling process">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00f0ff"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#0a0e17"/>
  <text x="30" y="40" fill="url(#g)" font-size="20" font-weight="700">// Threat Modeling Process</text>
  <g>
    <!-- steps -->
    <g>
      <rect x="30"  y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4"/>
      <text x="90"  y="112" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="90"  y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Define</text>
      <text x="90"  y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Scope</text>
    </g>
    <g>
      <rect x="175" y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4"/>
      <text x="235" y="112" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="235" y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Model</text>
      <text x="235" y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">System</text>
    </g>
    <g>
      <rect x="320" y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4"/>
      <text x="380" y="112" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="380" y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Identify</text>
      <text x="380" y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Threats</text>
    </g>
    <g>
      <rect x="465" y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="525" y="112" fill="#a855f7" font-size="13" font-weight="700" text-anchor="middle">4</text>
      <text x="525" y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Assess &amp;</text>
      <text x="525" y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Prioritize</text>
    </g>
    <g>
      <rect x="610" y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#00ff88" stroke-opacity="0.5"/>
      <text x="670" y="112" fill="#00ff88" font-size="13" font-weight="700" text-anchor="middle">5</text>
      <text x="670" y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Mitigate</text>
      <text x="670" y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">&amp; Control</text>
    </g>
    <g>
      <rect x="755" y="80" width="120" height="90" rx="10" fill="#141c2e" stroke="#00ff88" stroke-opacity="0.5"/>
      <text x="815" y="112" fill="#00ff88" font-size="13" font-weight="700" text-anchor="middle">6</text>
      <text x="815" y="134" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Accept</text>
      <text x="815" y="150" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Residual</text>
    </g>
    <!-- arrows -->
    <line x1="152" y1="125" x2="173" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="297" y1="125" x2="318" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="442" y1="125" x2="463" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="587" y1="125" x2="608" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="732" y1="125" x2="753" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
