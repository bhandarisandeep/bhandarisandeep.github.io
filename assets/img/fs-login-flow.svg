<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'JetBrains Mono', monospace" role="img" aria-label="Login decision flow with the Windows failure code for each failed step">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00f0ff"/>
    </marker>
    <marker id="farrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5577"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#0a0e17"/>
  <text x="30" y="36" fill="url(#g)" font-size="18" font-weight="700">// Reading a "No Permission" Login Failure</text>

  <!-- happy path -->
  <g fill="#141c2e" stroke="#00f0ff" stroke-opacity="0.4">
    <rect x="30"  y="70" width="120" height="60" rx="8"/>
    <rect x="174" y="70" width="120" height="60" rx="8"/>
    <rect x="318" y="70" width="120" height="60" rx="8"/>
    <rect x="462" y="70" width="120" height="60" rx="8"/>
    <rect x="606" y="70" width="120" height="60" rx="8"/>
    <rect x="750" y="70" width="120" height="60" rx="8" stroke="#00ff88" stroke-opacity="0.8"/>
  </g>
  <g fill="#e2e8f0" font-size="11" text-anchor="middle">
    <text x="90"  y="95">Client sends</text><text x="90"  y="112">username</text>
    <text x="234" y="95">Username</text><text x="234" y="112">exists?</text>
    <text x="378" y="95">Password</text><text x="378" y="112">correct?</text>
    <text x="522" y="95">Account</text><text x="522" y="112">enabled?</text>
    <text x="666" y="95">Share + NTFS</text><text x="666" y="112">allow it?</text>
    <text x="810" y="95" fill="#00ff88" font-weight="700">Connected</text>
  </g>
  <g stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)">
    <line x1="150" y1="100" x2="172" y2="100"/>
    <line x1="294" y1="100" x2="316" y2="100"/>
    <line x1="438" y1="100" x2="460" y2="100"/>
    <line x1="582" y1="100" x2="604" y2="100"/>
    <line x1="726" y1="100" x2="748" y2="100"/>
  </g>

  <!-- failure branches -->
  <g stroke="#ff5577" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#farrow)">
    <line x1="234" y1="132" x2="234" y2="168"/>
    <line x1="378" y1="132" x2="378" y2="168"/>
    <line x1="522" y1="132" x2="522" y2="168"/>
    <line x1="666" y1="132" x2="666" y2="168"/>
  </g>
  <g fill="#1d1420" stroke="#ff5577" stroke-opacity="0.6">
    <rect x="174" y="170" width="120" height="70" rx="8"/>
    <rect x="318" y="170" width="120" height="70" rx="8"/>
    <rect x="462" y="170" width="120" height="70" rx="8"/>
    <rect x="606" y="170" width="120" height="70" rx="8"/>
  </g>
  <g fill="#ff8aa0" font-size="10" text-anchor="middle">
    <text x="234" y="190" font-weight="700">0xC0000064</text>
    <text x="234" y="206">Fix: correct</text>
    <text x="234" y="222">username</text>
    <text x="378" y="190" font-weight="700">0xC000006A</text>
    <text x="378" y="206">Fix: reset</text>
    <text x="378" y="222">password</text>
    <text x="522" y="190" font-weight="700">0xC0000072</text>
    <text x="522" y="206">Fix: enable</text>
    <text x="522" y="222">the account</text>
    <text x="666" y="190" font-weight="700">Access denied</text>
    <text x="666" y="206">Fix: share and</text>
    <text x="666" y="222">NTFS permissions</text>
  </g>

  <text x="30" y="280" fill="#8892a8" font-size="11">Codes come from Windows Security log, Event ID 4625. Look at Status / SubStatus.</text>
</svg>
