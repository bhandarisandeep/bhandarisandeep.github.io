title: Sandeep Bhandari
description: Application Security Engineer — notes on web/mobile security, threat modeling, and AppSec at scale.
url: "https://bhandarisandeep.com"
author: Sandeep Bhandari

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/

# Publish posts even if their timestamp is ahead of the (UTC) build time.
# Without this, a post dated "today" in a +0530 timezone can be treated as
# "future" during a UTC build and silently excluded from the site.
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Keep the hand-built home page and assets out of Jekyll's processing;
# they are served as-is.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Default layout for posts
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
